<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1284px; height: 2778px; overflow: hidden; }
  body {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
    background:
      radial-gradient(110% 68% at 50% -6%, rgba(123,79,176,0.60) 0%, rgba(45,27,105,0.30) 32%, rgba(13,13,26,0) 62%),
      linear-gradient(180deg, #16142f 0%, #0D0D1A 50%, #08080e 100%);
    position: relative;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 12px 3px rgba(255,255,255,0.5);
  }

  /* 캡션 */
  .caption {
    position: absolute;
    top: 172px; left: 0; right: 0;
    text-align: center;
    padding: 0 88px;
    z-index: 4;
  }
  .kicker {
    color: #B59BE0;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 9px;
    margin-bottom: 34px;
  }
  .caption h1 {
    color: #F2F0FA;
    font-weight: 800;
    font-size: 98px;
    line-height: 1.3;
    letter-spacing: -2.5px;
    text-shadow: 0 6px 44px rgba(0,0,0,0.5);
  }

  /* 보랏빛 글로우 */
  .glow {
    position: absolute;
    top: 720px; left: 50%;
    width: 1100px; height: 1100px;
    transform: translateX(-50%);
    background: radial-gradient(44% 40% at 50% 42%, rgba(149,117,205,0.32) 0%, rgba(149,117,205,0) 70%);
    z-index: 1;
  }

  /* 바닥 그림자 */
  .floor {
    position: absolute;
    bottom: 150px; left: 50%;
    width: 820px; height: 150px;
    transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 70%);
    filter: blur(22px);
    z-index: 2;
  }

  /* 3D 무대 */
  .scene {
    position: absolute;
    left: 0; right: 0;
    top: 560px; bottom: -40px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2600px;
    perspective-origin: 50% 42%;
    z-index: 3;
  }
  .device {
    position: relative;
    width: 880px;
    transform-style: preserve-3d;
    transform: rotateY(__TILTY__deg) rotateX(5deg) rotateZ(__TILTZ__deg);
    border-radius: 66px;
    box-shadow:
      __SHX__px 64px 130px rgba(0,0,0,0.58),
      0 0 0 2px rgba(181,155,224,0.18);
  }
  .device .screen {
    border-radius: 60px;
    overflow: hidden;
    border: 12px solid #1c1c34;
  }
  .device img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="star" style="width:9px;height:9px;top:130px;left:140px;opacity:.9"></div>
  <div class="star" style="width:6px;height:6px;top:240px;left:1090px;opacity:.8"></div>
  <div class="star" style="width:5px;height:5px;top:96px;left:760px;opacity:.7"></div>
  <div class="star" style="width:7px;height:7px;top:360px;left:240px;opacity:.62"></div>
  <div class="star" style="width:5px;height:5px;top:190px;left:1160px;opacity:.6"></div>
  <div class="star" style="width:8px;height:8px;top:440px;left:1010px;opacity:.7"></div>
  <div class="star" style="width:4px;height:4px;top:300px;left:560px;opacity:.5"></div>
  <div class="star" style="width:6px;height:6px;top:150px;left:430px;opacity:.55"></div>

  <div class="caption">
    <div class="kicker">DREAMTELLER</div>
    <h1>__LINE1__<br>__LINE2__</h1>
  </div>

  <div class="glow"></div>
  <div class="floor"></div>

  <div class="scene">
    <div class="device"><div class="screen"><img src="__IMAGE__" /></div></div>
  </div>
</body>
</html>
