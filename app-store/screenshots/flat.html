<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1284px; height: 2778px; overflow: hidden; }
  body {
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(70% 48% at 50% -6%, rgba(123,79,176,0.44) 0%, rgba(13,13,26,0) 60%),
      linear-gradient(180deg, #16142f 0%, #0D0D1A 52%, #08080e 100%);
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 12px 3px rgba(255,255,255,0.5);
  }

  /* 큰 제목 (상단 중앙) */
  .caption {
    position: absolute;
    top: 180px; left: 0; right: 0;
    text-align: center;
    padding: 0 90px;
    z-index: 5;
  }
  .kicker {
    color: #B59BE0;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 9px;
    margin-bottom: 30px;
  }
  .caption h1 {
    color: #F2F0FA;
    font-weight: 800;
    font-size: 88px;
    line-height: 1.3;
    letter-spacing: -2.2px;
    text-shadow: 0 6px 44px rgba(0,0,0,0.5);
  }

  /* 작은 설명 (하단 중앙) */
  .desc {
    position: absolute;
    bottom: 470px; left: 0; right: 0;
    text-align: center;
    padding: 0 110px;
    z-index: 5;
  }
  .desc p {
    color: #BDB6D8;
    font-weight: 500;
    font-size: 39px;
    line-height: 1.6;
    letter-spacing: -0.4px;
  }

  .glow {
    position: absolute;
    top: 850px; left: 50%;
    width: 1100px; height: 1100px;
    transform: translateX(-50%);
    background: radial-gradient(44% 40% at 50% 42%, rgba(149,117,205,0.30) 0%, rgba(149,117,205,0) 70%);
    z-index: 1;
  }
  .floor {
    position: absolute;
    top: 1990px; left: 50%;
    width: 760px; height: 150px;
    transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 70%);
    filter: blur(24px);
    z-index: 2;
  }

  /* 기기 (중앙) */
  .stage {
    position: absolute;
    inset: 0;
    perspective: 2600px;
    perspective-origin: 50% 50%;
    z-index: 3;
  }
  .phone {
    position: absolute;
    top: 640px; left: 50%;
    width: 680px;
    transform: translateX(-50%);
    transform-style: preserve-3d;
    border-radius: 60px;
    box-shadow: 0 50px 120px rgba(0,0,0,0.55), 0 0 0 2px rgba(181,155,224,0.18);
  }
  .phone .screen {
    border-radius: 54px;
    overflow: hidden;
    border: 12px solid #1c1c34;
  }
  .phone img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="star" style="width:9px;height:9px;top:150px;left:170px;opacity:.85"></div>
  <div class="star" style="width:6px;height:6px;top:250px;left:1090px;opacity:.7"></div>
  <div class="star" style="width:5px;height:5px;top:120px;left:760px;opacity:.65"></div>
  <div class="star" style="width:7px;height:7px;top:380px;left:280px;opacity:.6"></div>
  <div class="star" style="width:6px;height:6px;top:210px;left:1150px;opacity:.6"></div>
  <div class="star" style="width:6px;height:6px;top:2480px;left:300px;opacity:.55"></div>
  <div class="star" style="width:5px;height:5px;top:2560px;left:1020px;opacity:.5"></div>

  <div class="caption">
    <div class="kicker">DREAMTELLER</div>
    <h1>__TITLE__</h1>
  </div>

  <div class="glow"></div>
  <div class="floor"></div>

  <div class="stage">
    <div class="phone"><div class="screen"><img src="__IMG__" /></div></div>
  </div>

  <div class="desc">
    <p>__SUB__</p>
  </div>
</body>
</html>
