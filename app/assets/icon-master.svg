<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 밤하늘 배경 (더 어둡게) -->
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#15143A"/>
      <stop offset="55%" stop-color="#0C0B22"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <!-- 노란 달 -->
    <radialGradient id="moon" cx="40%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#FFE07A"/>
      <stop offset="100%" stop-color="#F0C040"/>
    </radialGradient>
    <!-- 달 glow -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD86B" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#FFD86B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD86B" stop-opacity="0"/>
    </radialGradient>
    <!-- 별빛 glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 구름 그라데이션 -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#54537F"/>
      <stop offset="100%" stop-color="#23234A"/>
    </linearGradient>
    <!-- 초승달 깎기 -->
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="500" cy="430" r="185" fill="white"/>
      <circle cx="595" cy="375" r="172" fill="black"/>
    </mask>
    <!-- 구름 부드러운 가장자리 -->
    <filter id="fluffy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 작은 별 (점) — 파티클처럼 많이 -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="120" r="2"/><circle cx="170" cy="80" r="1.4"/><circle cx="240" cy="150" r="2.4"/>
    <circle cx="330" cy="90" r="1.6"/><circle cx="410" cy="140" r="2"/><circle cx="470" cy="70" r="1.4"/>
    <circle cx="560" cy="120" r="2.2"/><circle cx="640" cy="80" r="1.6"/><circle cx="720" cy="140" r="2"/>
    <circle cx="800" cy="90" r="1.4"/><circle cx="880" cy="130" r="2.4"/><circle cx="950" cy="80" r="1.6"/>
    <circle cx="60" cy="250" r="1.6"/><circle cx="140" cy="320" r="2.2"/><circle cx="230" cy="270" r="1.4"/>
    <circle cx="300" cy="340" r="1.8"/><circle cx="780" cy="270" r="1.8"/><circle cx="860" cy="330" r="2.2"/>
    <circle cx="940" cy="280" r="1.6"/><circle cx="970" cy="430" r="2"/><circle cx="40" cy="430" r="1.8"/>
    <circle cx="110" cy="490" r="1.4"/><circle cx="900" cy="490" r="1.6"/><circle cx="60" cy="600" r="2.2"/>
    <circle cx="160" cy="560" r="1.4"/><circle cx="950" cy="580" r="1.8"/><circle cx="880" cy="640" r="1.6"/>
    <circle cx="120" cy="690" r="2"/><circle cx="980" cy="690" r="1.4"/><circle cx="500" cy="50" r="1.6"/>
    <circle cx="350" cy="50" r="1.4"/><circle cx="660" cy="50" r="1.4"/>
  </g>
  <!-- 빛나는 별빛 (glow 있는 동그란 빛) -->
  <g>
    <g><circle cx="180" cy="180" r="26" fill="url(#starGlow)"/><circle cx="180" cy="180" r="4" fill="#fff"/></g>
    <g><circle cx="360" cy="120" r="18" fill="url(#starGlow)"/><circle cx="360" cy="120" r="3" fill="#fff"/></g>
    <g><circle cx="850" cy="160" r="28" fill="url(#starGlow)"/><circle cx="850" cy="160" r="4.5" fill="#fff"/></g>
    <g><circle cx="700" cy="100" r="16" fill="url(#starGlow)"/><circle cx="700" cy="100" r="3" fill="#fff"/></g>
    <g><circle cx="120" cy="420" r="22" fill="url(#starGlow)"/><circle cx="120" cy="420" r="3.5" fill="#fff"/></g>
    <g><circle cx="920" cy="380" r="24" fill="url(#starGlow)"/><circle cx="920" cy="380" r="4" fill="#fff"/></g>
    <g><circle cx="150" cy="640" r="20" fill="url(#starGlow)"/><circle cx="150" cy="640" r="3" fill="#fff"/></g>
    <g><circle cx="900" cy="600" r="22" fill="url(#starGlow)"/><circle cx="900" cy="600" r="3.5" fill="#fff"/></g>
    <g><circle cx="250" cy="300" r="15" fill="url(#starGlow)"/><circle cx="250" cy="300" r="2.5" fill="#fff"/></g>
    <g><circle cx="780" cy="290" r="15" fill="url(#starGlow)"/><circle cx="780" cy="290" r="2.5" fill="#fff"/></g>
    <g><circle cx="500" cy="105" r="15" fill="url(#starGlow)"/><circle cx="500" cy="105" r="2.5" fill="#fff"/></g>
    <g><circle cx="60" cy="540" r="13" fill="url(#starGlow)"/><circle cx="60" cy="540" r="2" fill="#fff"/></g>
    <g><circle cx="960" cy="510" r="14" fill="url(#starGlow)"/><circle cx="960" cy="510" r="2" fill="#fff"/></g>
  </g>
  <!-- 반짝임 4각 별 -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M300 230 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
    <path d="M820 460 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
    <path d="M210 700 l3.5 11 11 3.5 -11 3.5 -3.5 11 -3.5 -11 -11 -3.5 11 -3.5 z"/>
  </g>

  <!-- 달 glow -->
  <circle cx="500" cy="430" r="240" fill="url(#moonHalo)"/>
  <!-- 노란 초승달 -->
  <g mask="url(#crescent)">
    <circle cx="500" cy="430" r="185" fill="url(#moon)"/>
  </g>

  <!-- 달 아래쪽만 가리는 앞쪽 구름 (더 하단으로, 조금 작게) -->
  <g filter="url(#fluffy)">
    <g fill="url(#cloud)">
      <ellipse cx="480" cy="600" rx="180" ry="62"/>
      <ellipse cx="360" cy="615" rx="100" ry="50"/>
      <ellipse cx="610" cy="608" rx="115" ry="54"/>
      <ellipse cx="715" cy="628" rx="78" ry="44"/>
      <ellipse cx="270" cy="635" rx="72" ry="40"/>
    </g>
  </g>

  <!-- 하늘을 채우는 주변 구름들 -->
  <g filter="url(#fluffy)" fill="url(#cloud)" opacity="0.85">
    <g>
      <ellipse cx="220" cy="840" rx="180" ry="66"/>
      <ellipse cx="110" cy="860" rx="110" ry="52"/>
      <ellipse cx="360" cy="855" rx="125" ry="56"/>
      <ellipse cx="480" cy="875" rx="95" ry="46"/>
    </g>
    <g>
      <ellipse cx="810" cy="820" rx="170" ry="62"/>
      <ellipse cx="930" cy="845" rx="115" ry="52"/>
      <ellipse cx="690" cy="840" rx="105" ry="48"/>
    </g>
    <g opacity="0.6">
      <ellipse cx="850" cy="300" rx="130" ry="44"/>
      <ellipse cx="950" cy="320" rx="85" ry="38"/>
      <ellipse cx="750" cy="320" rx="80" ry="34"/>
    </g>
    <g opacity="0.55">
      <ellipse cx="160" cy="250" rx="120" ry="42"/>
      <ellipse cx="80" cy="270" rx="78" ry="34"/>
      <ellipse cx="260" cy="265" rx="78" ry="34"/>
    </g>
  </g>
</svg>
